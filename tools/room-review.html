<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v18.1 — room furnishings preview</title><style>html,body{margin:0;background:#110e0c}iframe{display:block;border:0;width:100%;height:100dvh}</style></head><body>
<iframe title="Actual v18.1 gallery" id="gallery" src="../contact/?room-review=1" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe><script>
// This local authoring page is excluded from the release. Furnishings remain
// physical objects in the existing gallery, without new navigation sections.
const frame=document.querySelector('iframe'),allowed=new Set(['piano','gramophone','records','room','wine','bar','cigars','tv']),requested=new URLSearchParams(location.search).get('view'),active=allowed.has(requested)?requested:'piano';
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;w.__v9Paused=true;d.documentElement.dataset.roomReview=active;const ready=setInterval(()=>{if(!d.documentElement.classList.contains('iswas-scene-ready')||d.querySelector('.load-screen'))return;clearInterval(ready);const style=d.createElement('style');style.textContent='.sheet,.mast,footer,#gallery-progress,.gallery-controls,.gallery-hint,.gallery-pull,.tour-toggle,#morgan-guide,.morgan-wormhole-path,.morgan-speech-bubble{display:none!important}';d.head.append(style);w.__iswasTour?.setPaused(true,'furniture-review');d.documentElement.classList.add('is-gallery')},150)});
setInterval(()=>{const w=frame.contentWindow;frame.contentDocument.documentElement.dataset.roomReview=active;if(w.__iswasTour&&!w.__v9Paused)w.__iswasTour.setPaused(true,'furniture-review')},500);
</script><output id="room-diagnostics" style="display:none;position:fixed;bottom:0;left:0;z-index:1000;color:white;background:#000;font:12px monospace;max-width:100%;overflow-wrap:anywhere"></output><script>
if(new URLSearchParams(location.search).has('debug')){const out=document.querySelector('#room-diagnostics');out.style.display='block';setInterval(()=>{const data=frame.contentDocument?.documentElement.dataset;out.textContent=JSON.stringify({...data})},500)}
</script></body></html>
